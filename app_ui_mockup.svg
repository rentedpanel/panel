<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#0e1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients & Filters -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="switch-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="window-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <feStop offset="0%" stop-color="#1e1f25"/>
      <feStop offset="100%" stop-color="#14151a"/>
    </linearGradient>
    <linearGradient id="primary-switch" x1="0%" y1="0%" x2="100%" y2="100%">
      <feStop offset="0%" stop-color="#6750A4"/>
      <feStop offset="100%" stop-color="#7D5260"/>
    </linearGradient>
  </defs>

  <!-- Background Blur / Game Overlay Context -->
  <rect width="1000" height="680" fill="#0b0c10"/>
  <circle cx="200" cy="180" r="180" fill="#1f2430" opacity="0.5"/>
  <circle cx="850" cy="500" r="220" fill="#1b202c" opacity="0.4"/>

  <!-- Context Tag -->
  <text x="500" y="38" fill="#8e919a" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1.5">NATIVE ANDROID MATERIAL 3 OVERLAY • DIRECT /PROC/PID/MEM C++ INJECTION</text>

  <!-- Floating Window Card Container (MaterialCardView) -->
  <g transform="translate(100, 60)" filter="url(#card-shadow)">
    <!-- Window Border & Body -->
    <rect width="800" height="560" rx="20" fill="#1c1b1f" stroke="#49454f" stroke-width="1.2"/>

    <!-- MaterialToolbar (Header / Titlebar) -->
    <rect width="800" height="56" rx="20" fill="#25232a"/>
    <rect y="40" width="800" height="16" fill="#25232a"/>
    <line x1="0" y1="56" x2="800" y2="56" stroke="#49454f" stroke-width="1"/>

    <!-- App Icon & Title -->
    <rect x="20" y="14" width="28" height="28" rx="8" fill="#D0BCFF"/>
    <path d="M 34 20 L 40 25 L 34 36 L 31 29 L 26 27 Z" fill="#381E72"/>
    <text x="58" y="33" fill="#E6E1E5" font-size="17" font-weight="700">ProInjector</text>

    <!-- Status Chip (LIVE C++) -->
    <g transform="translate(160, 16)">
      <rect width="160" height="24" rx="8" fill="#2A3828" stroke="#46673D" stroke-width="1"/>
      <circle cx="14" cy="12" r="4" fill="#6DD58C"/>
      <text x="26" y="16.5" fill="#C4EED0" font-size="11" font-weight="700" letter-spacing="0.5">LIVE C++ (PID: 14209)</text>
    </g>

    <!-- Window Controls (Minimize, Maximize, Close) -->
    <g transform="translate(680, 14)">
      <!-- Minimize -->
      <circle cx="16" cy="14" r="14" fill="#33303c"/>
      <line x1="10" y1="14" x2="22" y2="14" stroke="#CAC4D0" stroke-width="2" stroke-linecap="round"/>
      <!-- Maximize -->
      <circle cx="52" cy="14" r="14" fill="#33303c"/>
      <rect x="46" y="8" width="12" height="12" rx="2" fill="none" stroke="#CAC4D0" stroke-width="1.8"/>
      <!-- Close -->
      <circle cx="88" cy="14" r="14" fill="#33303c"/>
      <path d="M 83 9 L 93 19 M 93 9 L 83 19" stroke="#F2B8B5" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Body Layout: Left NavigationRailView + Right Cards Area -->
    <g transform="translate(0, 56)">
      <!-- NavigationRailView (64px width) -->
      <rect width="68" height="504" fill="#201f24"/>
      <line x1="68" y1="0" x2="68" y2="504" stroke="#49454f" stroke-width="1"/>

      <!-- Nav Rail Icons -->
      <!-- Item 1: Active Dashboard -->
      <g transform="translate(10, 24)">
        <rect width="48" height="32" rx="16" fill="#4F378B"/>
        <!-- Dashboard Icon -->
        <rect x="18" y="10" width="5" height="5" rx="1" fill="#EADDFF"/>
        <rect x="25" y="10" width="5" height="5" rx="1" fill="#EADDFF"/>
        <rect x="18" y="17" width="5" height="5" rx="1" fill="#EADDFF"/>
        <rect x="25" y="17" width="5" height="5" rx="1" fill="#EADDFF"/>
      </g>
      <!-- Item 2: Combat -->
      <g transform="translate(10, 80)">
        <circle cx="24" cy="16" r="10" fill="none" stroke="#938F99" stroke-width="1.8"/>
        <circle cx="24" cy="16" r="3" fill="#938F99"/>
      </g>
      <!-- Item 3: Visuals -->
      <g transform="translate(10, 136)">
        <path d="M 16 16 Q 24 9 32 16 Q 24 23 16 16 Z" fill="none" stroke="#938F99" stroke-width="1.8"/>
        <circle cx="24" cy="16" r="3" fill="#938F99"/>
      </g>
      <!-- Item 4: Process -->
      <g transform="translate(10, 192)">
        <rect x="17" y="10" width="14" height="12" rx="2" fill="none" stroke="#938F99" stroke-width="1.8"/>
        <line x1="20" y1="14" x2="28" y2="14" stroke="#938F99" stroke-width="1.5"/>
      </g>
      <!-- Item 5: Settings -->
      <g transform="translate(10, 248)">
        <circle cx="24" cy="16" r="7" fill="none" stroke="#938F99" stroke-width="1.8"/>
      </g>

      <!-- Main Live Menu Feature Cards (2 Columns x 4 Rows) -->
      <g transform="translate(84, 16)">

        <!-- Row 1: God Mode & Infinite Ammo -->
        <!-- Card 0: God Mode -->
        <g transform="translate(0, 0)">
          <rect width="340" height="78" rx="14" fill="#2b2930" stroke="#49454f" stroke-width="1"/>
          <text x="18" y="32" fill="#E6E1E5" font-size="15" font-weight="700">God Mode</text>
          <text x="18" y="52" fill="#938F99" font-size="12">Health &amp; Armor Lock • 0x3A5F1C0</text>
          <rect x="18" y="59" width="70" height="14" rx="4" fill="#1C3829"/>
          <text x="24" y="69.5" fill="#6DD58C" font-size="9" font-weight="700">ACTIVE IN C++</text>
          <!-- Switch ON -->
          <g transform="translate(270, 24)">
            <rect width="52" height="30" rx="15" fill="#D0BCFF"/>
            <circle cx="37" cy="15" r="11" fill="#381E72" filter="url(#switch-shadow)"/>
          </g>
        </g>

        <!-- Card 1: Infinite Ammo -->
        <g transform="translate(356, 0)">
          <rect width="340" height="78" rx="14" fill="#2b2930" stroke="#49454f" stroke-width="1"/>
          <text x="18" y="32" fill="#E6E1E5" font-size="15" font-weight="700">Infinite Ammo</text>
          <text x="18" y="52" fill="#938F99" font-size="12">No Reload &amp; Freeze • 0x3A61A44</text>
          <rect x="18" y="59" width="70" height="14" rx="4" fill="#1C3829"/>
          <text x="24" y="69.5" fill="#6DD58C" font-size="9" font-weight="700">ACTIVE IN C++</text>
          <!-- Switch ON -->
          <g transform="translate(270, 24)">
            <rect width="52" height="30" rx="15" fill="#D0BCFF"/>
            <circle cx="37" cy="15" r="11" fill="#381E72" filter="url(#switch-shadow)"/>
          </g>
        </g>

        <!-- Row 2: No Recoil & Speed Boost -->
        <!-- Card 2: No Recoil -->
        <g transform="translate(0, 90)">
          <rect width="340" height="78" rx="14" fill="#25232a" stroke="#49454f" stroke-width="1"/>
          <text x="18" y="32" fill="#E6E1E5" font-size="15" font-weight="700">No Recoil</text>
          <text x="18" y="52" fill="#938F99" font-size="12">Zero Shake &amp; Spread • 0x1C2E5A0</text>
          <!-- Switch OFF -->
          <g transform="translate(270, 24)">
            <rect width="52" height="30" rx="15" fill="#49454F" stroke="#938F99" stroke-width="1.5"/>
            <circle cx="15" cy="15" r="8" fill="#938F99"/>
          </g>
        </g>

        <!-- Card 3: Speed Boost -->
        <g transform="translate(356, 90)">
          <rect width="340" height="78" rx="14" fill="#2b2930" stroke="#49454f" stroke-width="1"/>
          <text x="18" y="32" fill="#E6E1E5" font-size="15" font-weight="700">Speed Boost</text>
          <text x="18" y="52" fill="#938F99" font-size="12">2.0x Velocity Boost • 0x2F8A120</text>
          <rect x="18" y="59" width="70" height="14" rx="4" fill="#1C3829"/>
          <text x="24" y="69.5" fill="#6DD58C" font-size="9" font-weight="700">ACTIVE IN C++</text>
          <!-- Switch ON -->
          <g transform="translate(270, 24)">
            <rect width="52" height="30" rx="15" fill="#D0BCFF"/>
            <circle cx="37" cy="15" r="11" fill="#381E72" filter="url(#switch-shadow)"/>
          </g>
        </g>

        <!-- Row 3: Teleport & Anti-Aim -->
        <!-- Card 4: Teleport -->
        <g transform="translate(0, 180)">
          <rect width="340" height="78" rx="14" fill="#25232a" stroke="#49454f" stroke-width="1"/>
          <text x="18" y="32" fill="#E6E1E5" font-size="15" font-weight="700">Teleport</text>
          <text x="18" y="52" fill="#938F99" font-size="12">Coordinate Override • 0x3B10078</text>
          <!-- Switch OFF -->
          <g transform="translate(270, 24)">
            <rect width="52" height="30" rx="15" fill="#49454F" stroke="#938F99" stroke-width="1.5"/>
            <circle cx="15" cy="15" r="8" fill="#938F99"/>
          </g>
        </g>

        <!-- Card 5: Anti-Aim -->
        <g transform="translate(356, 180)">
          <rect width="340" height="78" rx="14" fill="#25232a" stroke="#49454f" stroke-width="1"/>
          <text x="18" y="32" fill="#E6E1E5" font-size="15" font-weight="700">Anti-Aim</text>
          <text x="18" y="52" fill="#938F99" font-size="12">Desync &amp; Angle Shake • 0x2D44C90</text>
          <!-- Switch OFF -->
          <g transform="translate(270, 24)">
            <rect width="52" height="30" rx="15" fill="#49454F" stroke="#938F99" stroke-width="1.5"/>
            <circle cx="15" cy="15" r="8" fill="#938F99"/>
          </g>
        </g>

        <!-- Row 4: Radar ESP & Magic Bullet -->
        <!-- Card 6: Radar ESP -->
        <g transform="translate(0, 270)">
          <rect width="340" height="78" rx="14" fill="#2b2930" stroke="#49454f" stroke-width="1"/>
          <text x="18" y="32" fill="#E6E1E5" font-size="15" font-weight="700">Radar ESP</text>
          <text x="18" y="52" fill="#938F99" font-size="12">Minimap Coordinates • 0x4A82E10</text>
          <rect x="18" y="59" width="70" height="14" rx="4" fill="#1C3829"/>
          <text x="24" y="69.5" fill="#6DD58C" font-size="9" font-weight="700">ACTIVE IN C++</text>
          <!-- Switch ON -->
          <g transform="translate(270, 24)">
            <rect width="52" height="30" rx="15" fill="#D0BCFF"/>
            <circle cx="37" cy="15" r="11" fill="#381E72" filter="url(#switch-shadow)"/>
          </g>
        </g>

        <!-- Card 7: Magic Bullet -->
        <g transform="translate(356, 270)">
          <rect width="340" height="78" rx="14" fill="#2b2930" stroke="#49454f" stroke-width="1"/>
          <text x="18" y="32" fill="#E6E1E5" font-size="15" font-weight="700">Magic Bullet</text>
          <text x="18" y="52" fill="#938F99" font-size="12">Direct Raycast Hitbox • 0x5021D4C</text>
          <rect x="18" y="59" width="70" height="14" rx="4" fill="#1C3829"/>
          <text x="24" y="69.5" fill="#6DD58C" font-size="9" font-weight="700">ACTIVE IN C++</text>
          <!-- Switch ON -->
          <g transform="translate(270, 24)">
            <rect width="52" height="30" rx="15" fill="#D0BCFF"/>
            <circle cx="37" cy="15" r="11" fill="#381E72" filter="url(#switch-shadow)"/>
          </g>
        </g>

        <!-- Bottom Real-time Memory Hook Card -->
        <g transform="translate(0, 360)">
          <rect width="696" height="66" rx="14" fill="#232127" stroke="#49454f" stroke-width="1"/>
          <!-- Shield Icon -->
          <circle cx="32" cy="33" r="16" fill="#2A3828"/>
          <path d="M 27 33 L 31 37 L 38 29" stroke="#6DD58C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <!-- Info -->
          <text x="58" y="28" fill="#E6E1E5" font-size="14" font-weight="700">Memory Engine: Active &amp; Hooked</text>
          <text x="58" y="47" fill="#938F99" font-size="12">Target: com.target.game • PID: 14209 • /proc/14209/mem • libil2cpp.so base: 0x7b4a2000</text>
          <!-- Re-Scan PID MaterialButton -->
          <g transform="translate(580, 16)">
            <rect width="100" height="34" rx="17" fill="#4F378B"/>
            <text x="50" y="22" fill="#EADDFF" font-size="12" font-weight="700" text-anchor="middle">Re-Scan PID</text>
          </g>
        </g>

      </g>
    </g>
  </g>
</svg>
